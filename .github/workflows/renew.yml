name: Katabump Auto Renew

on:
  schedule:
    # 每天 UTC 0点 (北京时间 8点) 运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb python3-yaml
        npm install
        npx playwright install-deps chrome

    - name: Run Renew Script (with mihomo proxy)
      env:
        # 修复：GitHub Actions 容器没有 DBus session bus，需要设置为 /dev/null
        DBUS_SESSION_BUS_ADDRESS: /dev/null
        # 将 USERS_JSON 配置在 GitHub Repository Secrets 中
        # 格式: [{"username": "xxx", "password": "xxx"}, ...]
        USERS_JSON: ${{ secrets.USERS_JSON }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        echo "=== 下载 mihomo ==="
        curl -sL -o mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.19.29/mihomo-linux-amd64-v1.19.29.gz
        gunzip -f mihomo.gz
        chmod +x mihomo
        ls -la mihomo

        echo "=== 生成配置 (OVH 节点) ==="
        python3 << 'PYEOF'
        import yaml
        proxies = [
            {
                'name': 'Hysteria2-OVH',
                'type': 'hysteria2',
                'server': '51.75.118.170',
                'port': 20102,
                'password': '8ea29bda-a3e1-4539-9904-b8fbf7cef6f1',
                'sni': 'www.bing.com',
                'skip-cert-verify': True
            },
            {
                'name': 'Reality-OVH',
                'type': 'vless',
                'server': '51.75.118.170',
                'port': 20102,
                'uuid': '8ea29bda-a3e1-4539-9904-b8fbf7cef6f1',
                'network': 'tcp',
                'tls': True,
                'udp': True,
                'flow': 'xtls-rprx-vision',
                'servername': 'www.nazhumi.com',
                'client-fingerprint': 'firefox',
                'reality-opts': {
                    'public-key': 'U0nqrnrABbaZg1l_Y3v7MfoMI4gj0HMQseUpc7pO2Es',
                    'short-id': ''
                }
            }
        ]
        names = [p['name'] for p in proxies]
        cfg = {
            'mixed-port': 7890,
            'allow-lan': False,
            'mode': 'rule',
            'log-level': 'warning',
            'proxies': proxies,
            'proxy-groups': [{
                'name': 'GLOBAL',
                'type': 'url-test',
                'proxies': names,
                'url': 'https://www.google.com',
                'interval': 30
            }],
            'rules': ['MATCH,GLOBAL']
        }
        with open('mihomo.yaml', 'w', encoding='utf-8') as f:
            yaml.safe_dump(cfg, f, allow_unicode=True)
        print('配置生成成功: ' + str(len(proxies)) + ' 个节点')
        PYEOF

        echo "=== 启动 mihomo ==="
        nohup ./mihomo -d . -f mihomo.yaml > mihomo.log 2>&1 &
        sleep 8
        code=$(curl -x http://127.0.0.1:7890 -s -o /dev/null -w "%{http_code}" --max-time 15 https://www.google.com 2>/dev/null || echo "fail")
        echo "mihomo 代理访问 Google: $code"
        echo "--- mihomo 日志 ---"
        cat mihomo.log || true

        echo "=== 运行脚本 ==="
        export HTTP_PROXY=http://127.0.0.1:7890
        export HTTPS_PROXY=http://127.0.0.1:7890
        xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" node action_renew.js

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: screenshots/
